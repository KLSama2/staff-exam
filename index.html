<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c2410c">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>员工考核</title>
<style>
:root{
  --bg:#f5f3ef; --card:#fff; --ink:#1c1917; --sub:#78716c;
  --line:#e7e5e4; --accent:#c2410c; --accent-soft:#fff1e8;
  --ok:#15803d; --ok-soft:#ecfdf3; --bad:#b91c1c; --bad-soft:#fef2f2;
  --radius:16px; --shadow:0 1px 2px rgba(28,25,23,.05),0 10px 30px -18px rgba(28,25,23,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  min-height:100vh;min-height:100dvh;padding-bottom:env(safe-area-inset-bottom);
  -webkit-text-size-adjust:100%;
}
.screen{display:none}
.screen.on{display:block}
.wrap{max-width:640px;margin:0 auto;padding:20px 18px 40px}
.hero h1{font-size:26px;line-height:1.3;margin:0 0 6px;letter-spacing:-.5px}
.hero p{margin:0 0 18px;color:var(--sub);font-size:14px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:#fef3c7;color:#92400e;margin-bottom:10px}
.label{font-size:13px;font-weight:700;color:var(--sub);margin:18px 0 8px;letter-spacing:.3px;display:flex;justify-content:space-between;align-items:center}
.label em{font-style:normal;font-weight:500;font-size:12px;color:#a8a29e}
.seg{display:flex;background:#ebe7e1;border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:12px 4px;border-radius:11px;font-size:15.5px;font-weight:700;color:#57534e;font-family:inherit;cursor:pointer;transition:.15s}
.seg button.on{background:#fff;color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.10)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13.5px;color:#44403c;font-family:inherit;cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:#fdba74;color:#9a3412;font-weight:700}
.chip small{font-size:11px;opacity:.7;margin-left:3px}
.chip.zero{opacity:.4;cursor:default}
.chip:disabled{pointer-events:none}
.links button.zero{opacity:.4}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stagecard{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 8px;text-align:left;font-family:inherit;cursor:pointer;line-height:1.35}
.stagecard b{display:block;font-size:14px;color:var(--ink)}
.stagecard span{font-size:11px;color:var(--sub);display:block;margin-top:1px}
.stagecard.on{border-color:var(--accent);background:var(--accent-soft)}
.stagecard.on b{color:var(--accent)}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;transition:.15s}
.btn:active{transform:scale(.99)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 8px 20px -10px rgba(194,65,12,.8)}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.mt8{margin-top:8px}.mt10{margin-top:10px}.mt16{margin-top:16px}.mt22{margin-top:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow)}
.statline{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.statline b{font-size:21px;letter-spacing:-.5px}
.mini{font-size:12.5px;color:var(--sub);line-height:1.6}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.links button{background:none;border:0;padding:8px 9px;font-size:13px;color:#57534e;font-family:inherit;cursor:pointer;border-radius:9px}
.links button:active{background:#e7e5e4}
.field select{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:13px;font-size:16px;font-family:inherit;background:#fff}
.field input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:13px;font-size:16px;font-family:inherit;background:#fff}
.field input:focus{outline:none;border-color:var(--accent)}
.hintline{font-size:12.5px;color:var(--sub);margin-top:7px;line-height:1.6}
/* ---------- quiz ---------- */
#scr-quiz{min-height:100dvh;padding-bottom:112px}
.quizhead{position:sticky;top:0;z-index:9;background:rgba(245,243,239,.94);backdrop-filter:blur(10px);padding:12px 18px 8px;display:flex;align-items:center;gap:10px}
.iconbtn.sub{width:auto;padding:0 12px;font-size:13px;font-weight:800;color:#fff;background:var(--accent)}
.iconbtn{width:38px;height:38px;flex:none;border:0;border-radius:12px;background:#e7e5e4;color:#57534e;font-size:17px;font-family:inherit;cursor:pointer}
.qmeta{flex:1;min-width:0}
.qpos{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.dot{color:#a8a29e;margin:0 6px}
.qpos b{color:var(--ink);font-size:16px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;color:var(--accent);padding:5px 9px;border-radius:10px;background:var(--accent-soft)}
.timer.warn{color:#fff;background:var(--bad)}
.pbar{height:4px;background:#e7e5e4;margin:0 18px;border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .25s}
.qcard{padding:18px 18px 10px}
.qtype{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.6px}
.qtitle{font-size:13px;color:var(--sub);margin-top:2px}
.stem{font-size:18px;line-height:1.75;font-weight:600;margin:10px 0 16px;letter-spacing:.2px}
.stem.fillstem{line-height:2.7;font-weight:500}
.textbtn{border:0;background:none;color:var(--sub);font-size:13.5px;font-family:inherit;padding:6px 0;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px 15px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-size:16px;line-height:1.55;text-align:left;font-family:inherit;cursor:pointer;width:100%}
.opt .k{width:25px;height:25px;border-radius:8px;background:#f5f5f4;color:#78716c;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none;margin-top:1px}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.on .k{background:var(--accent);color:#fff}
.opt.ok{border-color:#86efac;background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:#fca5a5;background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default;opacity:1;color:var(--ink)}
.blank{border:0;border-bottom:2px solid #d6d3d1;background:#fffdf9;font-size:17px;font-weight:700;padding:3px 4px;margin:0 3px;border-radius:7px 7px 0 0;min-width:66px;width:80px;text-align:center;font-family:inherit;color:var(--accent)}
.blank:focus{outline:none;border-color:var(--accent);background:#fff7ed}
.blank.bad{border-color:#ef4444;background:#fef2f2;color:#b91c1c}
.blank.ok{border-color:#22c55e;background:#f0fdf4;color:#15803d}
.setblanks{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.setblank{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 8px 4px 6px}
.setblank b{font-size:11px;color:var(--sub);font-weight:700}
.setblank .blank{border-bottom-width:1.5px;background:transparent;margin:0}
.hint{font-size:12.5px;color:var(--sub);margin-top:10px}
.fb{margin-top:15px;padding:13px 15px;border-radius:13px;font-size:14.5px;line-height:1.75}
.fb.ok{background:var(--ok-soft);color:#14532d;border:1px solid #bbf7d0}
.fb.bad{background:var(--bad-soft);color:#7f1d1d;border:1px solid #fecaca}
.fb b{display:block;font-size:15px;margin-bottom:3px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:10px 18px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}
.bottom .inner{max-width:640px;margin:0 auto;display:flex;gap:10px}
.bottom .btn{flex:1}
.bottom .btn.primary{flex:1.6}
.orderbox{margin-bottom:14px}
.orderbox .cap{font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:8px}
.ochip{display:block;width:100%;text-align:left;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:15.5px;font-family:inherit;margin-bottom:8px;cursor:pointer;line-height:1.5}
.ochip .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--accent);color:#fff;font-size:12px;font-weight:800;margin-right:9px;vertical-align:1px}
.ochip.picked{background:var(--accent-soft);border-color:#fdba74}
/* ---------- result ---------- */
.resulthead{text-align:center;padding:22px 0 6px}
.ring{width:128px;height:128px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) var(--p,0%), #e7e5e4 0)}
.ring.pass{background:conic-gradient(var(--ok) var(--p,0%), #e7e5e4 0)}
.ring>div{width:100px;height:100px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:28px;font-weight:800;letter-spacing:-1px}
.ring small{font-size:11px;color:var(--sub);font-weight:500;display:block;text-align:center}
.verdict{font-size:19px;font-weight:800;margin-bottom:4px}
.verdict.pass{color:var(--ok)}.verdict.fail{color:var(--bad)}
.review{margin-top:8px}
.rev{border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:10px;background:#fff}
.rev .top{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--sub)}
.rev .q{font-size:14.5px;line-height:1.7;margin:6px 0 8px;font-weight:600;word-break:break-word}
.rev .q i{font-style:normal;color:var(--accent)}
.rev .ans{font-size:13.5px;line-height:1.8;color:#44403c}
.rev .ans em{font-style:normal;font-weight:700;color:var(--ok)}
.rev .ex{font-size:12.5px;color:var(--sub);margin-top:6px;line-height:1.7;border-top:1px dashed var(--line);padding-top:7px}
.tag{font-size:11.5px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--bad-soft);color:var(--bad)}
.allq{margin-top:14px;border:1px solid var(--line);border-radius:13px;background:#fff;padding:12px 14px}
.allq summary{font-size:14px;font-weight:700;cursor:pointer;color:#44403c}
.allq-body{margin-top:10px}
.qa{border-top:1px dashed var(--line);padding:10px 0;font-size:13.5px;line-height:1.7}
.qa:first-child{border-top:0}
.qa .num{color:var(--sub);margin-right:4px;font-weight:700}
.qa .ok{color:var(--ok);font-weight:800;font-size:12.5px;margin:2px 0}
.qa .no{color:var(--bad);font-weight:800;font-size:12.5px;margin:2px 0}.rec{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec .who{font-weight:700;font-size:15px}
.rec .when{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.rec .sc{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
#errbox{position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#b91c1c;color:#fff;padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.5;display:none;white-space:pre-wrap;max-height:40vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(8px);background:#292524;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.22s;z-index:60;max-width:86%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--sub);font-size:14px;padding:36px 0}
/* ---------- stats ---------- */
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.kpi b{display:block;font-size:20px;letter-spacing:-.5px}
.kpi span{font-size:11.5px;color:var(--sub)}
.barrow{display:flex;align-items:center;gap:9px;margin-bottom:9px;font-size:13px}
.barrow .nm{width:78px;flex:none;color:#44403c}
.barrow .tr{flex:1;height:8px;background:#eee9e3;border-radius:99px;overflow:hidden}
.barrow .tr i{display:block;height:100%;background:var(--accent);border-radius:99px}
.barrow .vl{width:44px;text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}
/* ---------- cert ---------- */
.cert{background:#fff;border:1px solid #e2d9cd;border-radius:12px;padding:24px 20px;text-align:center;position:relative;box-shadow:var(--shadow)}
.cert .cn{font-size:12px;letter-spacing:3px;color:var(--accent);font-weight:700}
.cert h2{font-size:23px;margin:8px 0 4px;letter-spacing:1px}
.cert .sub2{font-size:12.5px;color:var(--sub);margin-bottom:18px}
.cert .nm{font-size:26px;font-weight:800;letter-spacing:2px;border-bottom:1px solid #ded7cc;display:inline-block;padding:0 18px 5px;margin-bottom:14px}
.cert .txt{font-size:14px;line-height:2;color:#44403c;text-align:left;padding:0 4px}
.cert .txt b{color:var(--accent)}
.cert .foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:22px;font-size:12px;color:var(--sub);text-align:left}
.cert .seal{width:64px;height:64px;border:2px solid #c2410c;border-radius:50%;color:#c2410c;display:grid;place-items:center;font-size:11px;line-height:1.2;transform:rotate(-8deg);opacity:.85;text-align:center}
/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.on{display:block}
.sheet .mask{position:absolute;inset:0;background:rgba(28,25,23,.45)}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
.sheet .ptitle{font-size:16px;font-weight:800;margin-bottom:12px}
.sheet .pactions{display:flex;gap:10px;margin-top:18px}
.sheet .pactions .btn{flex:1;padding:13px;font-size:15px}
@media print{
  body{background:#fff}
  .no-print{display:none !important}
  .screen{display:none !important}
  .screen.on{display:block !important}
  .wrap{padding:0;max-width:100%}
  .cert{border:0;box-shadow:none}
}
@media (min-width:700px){ .wrap{padding-top:30px} .hero h1{font-size:29px} }
@media (min-width:720px){
  body{background:#e9e5df}
  .screen.on{max-width:680px;margin:0 auto;background:var(--bg);min-height:100dvh;box-shadow:0 0 50px rgba(28,25,23,.10)}
}
</style>
</head>
<body>
<div id="authGate" style="position:fixed;inset:0;z-index:200;background:#f5f3ef;display:none;align-items:center;justify-content:center;padding:20px">
  <div style="width:100%;max-width:340px;background:#fff;border:1px solid #e7e5e4;border-radius:16px;padding:22px 20px">
    <div style="font-size:20px;font-weight:800;margin-bottom:4px">员工考核</div>
    <div style="font-size:13px;color:#78716c;margin-bottom:16px">请输入账号密码</div>
    <input id="authUser" placeholder="账号" autocomplete="username" style="width:100%;padding:12px;border:1px solid #e7e5e4;border-radius:10px;font-size:16px;margin-bottom:10px">
    <input id="authPass" type="password" placeholder="密码" autocomplete="current-password" style="width:100%;padding:12px;border:1px solid #e7e5e4;border-radius:10px;font-size:16px;margin-bottom:10px">
    <button id="authBtn" style="width:100%;padding:13px;border:0;border-radius:11px;background:#c2410c;color:#fff;font-size:16px;font-weight:700">登录</button>
    <div id="authErr" style="color:#b91c1c;font-size:13px;margin-top:10px;min-height:18px"></div>
    <div style="color:#a8a29e;font-size:11.5px;margin-top:6px">没有账号请联系管理员</div>
  </div>
</div>

<!-- ================= HOME ================= -->
<section id="scr-home" class="screen on">
  <div class="wrap">
    <div class="hero">
      <h1>员工考核</h1>
      <p>后厨配方 · 每个产品都要考到</p>
    </div>

    <div class="label">考核方式</div>
    <div class="seg" id="modeSeg">
      <button data-mode="practice">练习</button>
      <button data-mode="exam" class="on">考试</button>
    </div>

    <div id="nameBox">
      <div class="label">员工姓名 <em>考试时填，可留空</em></div>
      <div class="field"><input id="nameInput" type="text" placeholder="留空按“自测”记录" autocomplete="off"></div>
      <div class="field" style="margin-top:8px"><input id="codeInput" type="text" placeholder="工号（可选）" autocomplete="off"></div>
      <div class="field" id="storeWrap" style="margin-top:8px" hidden><select id="storeSel"></select></div>
    </div>

    <div class="label">考核域 <em>可多选</em></div>
    <div class="chips" id="chips"></div>
    <div class="hintline">点已选中的「后厨配方」，可以再选品类</div>

    <button class="btn primary mt22" id="btnStart">开始考试</button>

    <div class="card mt16">
      <div class="statline">
        <div><div class="mini">题库</div><b id="bankCount">0</b> <span class="mini">题</span></div>
        <div style="text-align:right"><div class="mini">填空 / 选择判断</div><b id="fillRatio">0 / 0</b></div>
      </div>
      <div class="mini mt8" id="bankMeta"></div>
    </div>

    <div class="links">
      <button id="lnkWrong">错题本 <span id="wrongCount">0</span></button>
      <button id="lnkClearWrong" style="display:none">清空错题本</button>
      <button id="lnkRecords">成绩记录</button>
      <button id="lnkStats">看板</button>
      <button id="lnkImport">导入题库</button>
      <button id="lnkExport">导出题库</button>
    </div>
    <div class="mini" id="footNote" style="margin-top:12px;opacity:.75">离线可用 · 数据存在本机 · 建议每周导出一份成绩备份</div>
  </div>
</section>

<!-- ================= QUIZ ================= -->
<section id="scr-quiz" class="screen">
  <div class="quizhead">
    <button class="iconbtn" id="btnQuit" aria-label="退出">✕</button>
    <div class="qmeta">
      <div class="qpos"><b id="qidx">1</b> / <span id="qtotal">20</span><span class="dot">·</span><span id="qtagText"></span></div>
    </div>
    <button class="iconbtn sub" id="btnSubmit">交卷</button>
    <div class="timer" id="timer">00:00</div>
  </div>
  <div class="pbar"><i id="pbar"></i></div>
  <div class="qcard" id="qcard"></div>
  <div class="bottom">
    <div class="inner">
      <button class="btn ghost" id="btnPrev">上一题</button>
      <button class="btn primary" id="btnNext">下一题</button>
    </div>
  </div>
</section>

<!-- ================= RESULT ================= -->
<section id="scr-result" class="screen"><div class="wrap" id="resultWrap"></div></section>

<!-- ================= RECORDS ================= -->
<section id="scr-records" class="screen"><div class="wrap" id="recordsWrap"></div></section>

<!-- ================= STATS ================= -->
<section id="scr-stats" class="screen"><div class="wrap" id="statsWrap"></div></section>

<!-- ================= CERT ================= -->
<section id="scr-cert" class="screen"><div class="wrap" id="certWrap"></div></section>

<div class="sheet" id="sheet">
  <div class="mask" data-sheet-close></div>
  <div class="panel">
    <div class="ptitle">后厨配方 · 选择品类</div>
    <div class="chips" id="sheetChips"></div>
    <div class="pactions">
      <button class="btn ghost" id="sheetOff">不考后厨</button>
      <button class="btn ghost" id="sheetAll">全部品类</button>
      <button class="btn primary" id="sheetDone">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="errbox"></div>
<input type="file" id="fileInput" accept=".csv,.json,.txt,.xlsx,.xls,text/csv,application/json" hidden>

<script>
window.onerror = function (m, s, l) {
  var d = document.getElementById('errbox');
  if (!d) return;
  d.style.display = 'block';
  d.textContent = '页面出错：' + m + '（第 ' + l + ' 行），请把这段发给技术';

<script>
(function () {
  var AUTH = JSON.parse(document.getElementById('authdata').textContent);
  var b64d = function (s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
  var text = new TextEncoder();

  window.__STATIC__ = true;
  window.DEMO = { meta: AUTH.meta, domains: AUTH.domains, questions: [] };

  try {
    var saved = sessionStorage.getItem('zg_unlocked');
    if (saved) { window.DEMO = JSON.parse(saved); window.__UNLOCKED__ = true; }
  } catch (e) {}

  async function unlock(user, pass) {
    var u = null;
    for (var i = 0; i < AUTH.users.length; i++) if (AUTH.users[i].u === user) u = AUTH.users[i];
    if (!u) throw new Error('账号或密码不对');
    var base = await crypto.subtle.importKey('raw', text.encode(pass), 'PBKDF2', false, ['deriveKey']);
    var wrapKey = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64d(u.salt), iterations: AUTH.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var masterRaw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(u.iv) }, wrapKey, b64d(u.wrapped));
    var masterKey = await crypto.subtle.importKey('raw', masterRaw, 'AES-GCM', false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(AUTH.bank.iv) }, masterKey, b64d(AUTH.bank.ct));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  function showGate() {
    var g = document.getElementById('authGate');
    if (g) { g.style.display = 'flex'; var el = document.getElementById('authUser'); if (el) el.focus(); }
  }

  var btn = document.getElementById('authBtn');
  if (btn) {
    var doLogin = async function () {
      var u = document.getElementById('authUser').value.trim();
      var p = document.getElementById('authPass').value;
      var err = document.getElementById('authErr');
      err.textContent = '';
      btn.disabled = true; btn.textContent = '验证中...';
      try {
        var bank = await unlock(u, p);
        sessionStorage.setItem('zg_unlocked', JSON.stringify(bank));
        location.reload();
      } catch (e) {
        err.textContent = '账号或密码不对';
        btn.disabled = false; btn.textContent = '登录';
      }
    };
    btn.addEventListener('click', doLogin);
    document.getElementById('authPass').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  }

  if (!window.__UNLOCKED__) {
    showGate();
  } else {
    // 已解锁：加一个退出按钮
    document.addEventListener('DOMContentLoaded', function () {
      var links = document.querySelector('.links');
      if (!links) return;
      var b = document.createElement('button');
      b.textContent = '退出登录';
      b.addEventListener('click', function () { sessionStorage.removeItem('zg_unlocked'); location.reload(); });
      links.appendChild(b);
    });
  }
})();
</script>

    last: null, session: [], wrongOnly: false
  };

  function dom(id) { for (var i = 0; i < BANK.domains.length; i++) if (BANK.domains[i].id === id) return BANK.domains[i]; return null; }
  function domName(id) { var d = dom(id); return d ? d.name : id; }
  function subName(id) {
    for (var i = 0; i < BANK.domains.length; i++) {
      var d = BANK.domains[i];
      if (d.subs) for (var j = 0; j < d.subs.length; j++) if (d.subs[j].id === id) return d.subs[j].name;
    }
    return id;
  }

  /* ---------------- 判分 ---------------- */
  var SYN = [
    ['生抽', '酱油'], ['老抽', '酱油'], ['生粉', '淀粉', '玉米淀粉', '粟粉'],
    ['白胡椒', '白胡椒粉', '胡椒粉'], ['芫荽', '香菜'], ['鸡精', '味精'],
    ['毫升', 'ml'], ['克', 'g'], ['水牛乳', '水牛奶'], ['鲜奶', '鲜牛奶']
  ];
  function norm(s) {
    return String(s == null ? '' : s)
      .replace(/[\uFF01-\uFF5E]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
      .replace(/\s+/g, '').replace(/[，,。；;：:、]/g, '').toLowerCase();
  }
  function expand(s) {
    var out = [s], n = norm(s);
    SYN.forEach(function (g) { if (g.some(function (x) { return norm(x) === n; })) out = out.concat(g); });
    return out;
  }
  function matchBlank(val, b) {
    var s = norm(val);
    if (!s) return false;
    var num = parseFloat(s), list = expand(s);
    for (var i = 0; i < b.a.length; i++) {
      var t = norm(b.a[i]);
      if (list.indexOf(t) >= 0) return true;
      var tn = parseFloat(t);
      if (b.tol != null && !isNaN(num) && !isNaN(tn) && Math.abs(num - tn) <= Number(b.tol)) return true;
    }
    return false;
  }
  function gradeFill(q, r) {
    if (!r || !r.v) return 0;
    var vals = r.v, blanks = q.blanks, ok = 0, i;
    if (q.match === 'set') {
      var used = [];
      for (i = 0; i < vals.length; i++) {
        for (var j = 0; j < blanks.length; j++) {
          if (used[j]) continue;
          if (matchBlank(vals[i], blanks[j])) { used[j] = 1; ok++; break; }
        }
      }
      return ok / blanks.length;
    }
    for (i = 0; i < blanks.length; i++) if (matchBlank(vals[i], blanks[i])) ok++;
    return ok / blanks.length;
  }
  function gradeMulti(q, r) {
    if (!r || !r.v) return 0;
    var mine = r.v.slice().sort().join(','), right = q.answers.slice().sort().join(',');
    if (mine === right) return 1;
    var good = r.v.every(function (i) { return q.answers.indexOf(i) >= 0; });
    return good && r.v.length ? 0.5 : 0;
  }
  function gradeOrder(q, r) {
    if (!r || !r.v) return 0;
    var n = q.answer.length;
    if (n <= 1) return 1;
    var pos = {}, hit = 0, total = 0;
    q.answer.forEach(function (id, i) { pos[id] = i; });
    for (var i = 0; i < n; i++) for (var j = i + 1; j < n; j++) { total++; if (pos[r.v[i]] < pos[r.v[j]]) hit++; }
    return total ? hit / total : 0;
  }
  function grade(q, r) {
    if (!r) return 0;
    if (q.type === 'single') return r.v === q.answer ? 1 : 0;
    if (q.type === 'judge') return (r.v === 0) === (q.answer === true) ? 1 : 0;
    if (q.type === 'multi') return gradeMulti(q, r);
    if (q.type === 'fill') return gradeFill(q, r);
    if (q.type === 'order') return gradeOrder(q, r);
    return 0;
  }
  function rightText(q) {
    if (q.type === 'single') return q.options[q.answer];
    if (q.type === 'judge') return q.answer ? '正确' : '错误';
    if (q.type === 'multi') return q.answers.map(function (i) { return q.options[i]; }).join('、');
    if (q.type === 'fill') return q.blanks.map(function (b) { return b.a[0] + (b.unit || ''); }).join('、');
    if (q.type === 'order') { var m = {}; q.items.forEach(function (it) { m[it.id] = it.text; }); return q.answer.map(function (id, i) { return (i + 1) + '.' + m[id]; }).join(' / '); }
    return '';
  }
  function myText(q, r) {
    if (!r || r.v == null) return '未作答';
    if (q.type === 'single') return q.options[r.v] || '未作答';
    if (q.type === 'judge') return r.v === 0 ? '正确' : '错误';
    if (q.type === 'multi') return r.v.length ? r.v.map(function (i) { return q.options[i]; }).join('、') : '未作答';
    if (q.type === 'fill') return r.v.map(function (x) { return x || '—'; }).join(' / ');
    if (q.type === 'order') { var m = {}; q.items.forEach(function (it) { m[it.id] = it.text; }); return r.v.map(function (id, i) { return (i + 1) + '.' + (m[id] || ''); }).join(' / ') || '未作答'; }
    return '';
  }
  function typeLabel(t) { return { single: '单选题', multi: '多选题', judge: '判断题', fill: '填空题', order: '排序题' }[t] || t; }
  function qLabel(q) {
    var parts = [domName(q.domain)];
    if (q.sub) parts.push(subName(q.sub));
    return parts.join(' · ');
  }

  /* ---------------- 统计 / 抽题 ---------------- */
  function bankStats() {
    var total = BANK.questions.length;
    var fill = BANK.questions.filter(function (q) { return q.type === 'fill'; }).length;
    return { total: total, fill: fill, choice: total - fill, ratio: total ? fill / total : 0 };
  }
  function pool() {
    var list = BANK.questions;
    if (S.wrongOnly) return list.filter(function (q) { return WRONG.indexOf(q.id) >= 0; });
    if (!S.scope.length) return [];
    if (S.scope.length < BANK.domains.length) list = list.filter(function (q) { return S.scope.indexOf(q.domain) >= 0; });
    if (S.subs.length) list = list.filter(function (q) { return !q.sub || S.subs.indexOf(q.sub) >= 0; });
    return list;
  }

  /* ---------------- 首页 ---------------- */
  function renderHome() {
    var st = bankStats();
    $('#bankCount').textContent = st.total;
    $('#fillRatio').textContent = st.fill + ' / ' + st.choice;
    $('#bankMeta').textContent = (BANK.meta && BANK.meta.title ? BANK.meta.title : '自建题库')

    $('#nameBox').style.display = S.mode === 'practice' ? 'none' : '';
    $('#btnStart').textContent = S.mode === 'practice' ? '开始练习' : '开始考试';

    $('#wrongCount').textContent = WRONG.length ? WRONG.length + ' 道' : '';
    $('#lnkWrong').className = WRONG.length ? '' : 'zero';

  }

  function show(id) {

  /* ---------------- 品类面板 ---------------- */
  function openSheet() {
    var d = dom('recipe');
    if (!d || !d.subs) return;
    $('#sheetChips').innerHTML = d.subs.map(function (s) {
      var n = BANK.questions.filter(function (q) { return q.sub === s.id; }).length;
      return '<button class="chip' + (S.subs.indexOf(s.id) >= 0 ? ' on' : '') + (n ? '' : ' zero') + '" data-sub="' + esc(s.id) + '"'
        + (n ? '' : ' disabled') + '>' + esc(s.name) + (n ? '<small>' + n + '</small>' : '<small>暂无</small>') + '</button>';

  function closeSheet() { $('#sheet').classList.remove('on'); }

  /* 每个产品随机抽 1 题，并让整卷填空约占 60% */
  function buildPaper(list) {
    var map = {}, order = [];
    list.forEach(function (q) {
      var p = q.product || q.title || q.id;
      if (!map[p]) { map[p] = []; order.push(p); }
      map[p].push(q);
    });
    var n = order.length;
    var fillTarget = Math.ceil(n * 0.6);
    var shuffled = shuffle(order);
    var paper = [];
    shuffled.forEach(function (p, i) {
      var wantFill = i < fillTarget;
      var poolQ = map[p];
      var cand = poolQ.filter(function (q) { return wantFill ? q.type === 'fill' : q.type !== 'fill'; });
      if (!cand.length) cand = poolQ;
      paper.push(cand[Math.floor(Math.random() * cand.length)]);
    });
    return shuffle(paper);
  }

  function startRun() {
    var list = pool();
    if (!list.length && S.subs.length) { S.subs = []; list = pool(); if (list.length) toast('该品类暂无题目，已按全部品类出卷'); }
    if (!list.length) { toast(S.scope.length ? '这个范围还没有题目' : '先选一个考核范围'); return; }
    if (S.mode === 'exam') S.name = ($('#nameInput').value || '').trim() || '自测';
    S.paper = S.mode === 'practice' ? shuffle(list) : buildPaper(list);
    var n = S.paper.length;
    S.idx = 0; S.resp = {}; S.revealed = {}; S.wrongOnly = false;
    S.startAt = Date.now();
    S.endAt = S.mode === 'practice' ? 0 : Date.now() + n * 45 * 1000;
    show('quiz'); renderQuestion();
    if (S.mode === 'exam') startTimer(n * 45);
  }

  function startTimer(seconds) {
    stopTimer();
    var end = Date.now() + seconds * 1000;
    S.endAt = end;
    function tick() {
      var left = Math.round((end - Date.now()) / 1000);
      var el = $('#timer');
      el.textContent = clock(left);
      el.classList.toggle('warn', left <= 60);
      if (left <= 0) { stopTimer(); toast('时间到，自动交卷'); submit(); }
    }
    tick(); S.timerId = setInterval(tick, 500);
  }
  function stopTimer() { if (S.timerId) { clearInterval(S.timerId); S.timerId = null; } }

  /* ---------------- 答题 ---------------- */
  function cur() { return S.paper[S.idx]; }

  function renderQuestion() {
    var q = cur(); if (!q) return;
    $('#qidx').textContent = S.idx + 1;
    $('#qtotal').textContent = S.paper.length;
    $('#qtagText').textContent = qLabel(q);
    $('#pbar').style.width = (S.idx / S.paper.length * 100) + '%';
    $('#timer').style.display = S.mode === 'practice' ? 'none' : '';
    $('#btnSubmit').style.display = S.mode === 'practice' ? 'none' : '';

    var h = '<div class="qtype">' + typeLabel(q.type) + '</div>';
    if (q.title) h += '<div class="qtitle">' + esc(q.title) + '</div>';
    h += '<div class="stem' + (q.type === 'fill' ? ' fillstem' : '') + '">' + (q.type === 'fill' ? fillStem(q) : esc(q.stem)) + '</div>';

    var r = S.resp[q.id], revealed = !!S.revealed[q.id], sc = revealed ? grade(q, r) : 0;

    if (q.type === 'single' || q.type === 'judge' || q.type === 'multi') {
      var opts = q.type === 'judge' ? ['正确', '错误'] : q.options;
      h += '<div class="opts">';
      opts.forEach(function (t, i) {
        var cls = 'opt', picked = r && (q.type === 'multi' ? r.v.indexOf(i) >= 0 : r.v === i);
        if (picked) cls += ' on';
        if (revealed) {
          var isRight = q.type === 'multi' ? q.answers.indexOf(i) >= 0 : (q.type === 'judge' ? (i === 0) === (q.answer === true) : i === q.answer);
          if (isRight) cls += ' ok'; else if (picked) cls += ' bad';
        }
        h += '<button class="' + cls + '" data-opt="' + i + '"' + (revealed ? ' disabled' : '') + '><span class="k">' + String.fromCharCode(65 + i) + '</span><span>' + esc(t) + '</span></button>';
      });
      h += '</div>';
    } else if (q.type === 'order') {
      var chosen = (r && r.v) ? r.v : [];
      var rest = q.items.filter(function (it) { return chosen.indexOf(it.id) < 0; });
      h += '<div class="orderbox"><div class="cap">我的顺序（点一下可移除）</div>';
      if (!chosen.length) h += '<div class="mini" style="padding:4px 2px 10px">按顺序点下面的步骤</div>';
      chosen.forEach(function (id, i) {
        var it = q.items.filter(function (x) { return x.id === id; })[0];
        h += '<button class="ochip picked" data-pick="' + esc(id) + '"><span class="n">' + (i + 1) + '</span>' + esc(it.text) + '</button>';
      });
      h += '</div><div class="orderbox"><div class="cap">待排序</div>';
      rest.forEach(function (it) { h += '<button class="ochip" data-add="' + esc(it.id) + '">' + esc(it.text) + '</button>'; });
      h += '</div>';
    } else if (q.type === 'fill') {
      h += '<div class="hint">' + (q.match === 'set'
        ? '不分顺序，把缺的原料/数字填进去即可。'
        : '按顺序填；数字允许 ±2% 误差，单位不用写。') + '</div>';
    }

    if (!revealed && S.mode === 'practice') h += '<button class="textbtn" id="btnReveal">不会？直接看答案</button>';
    if (revealed) h += feedback(q, r, sc);
    $('#qcard').innerHTML = h;

    if (q.type === 'fill') {
      var vals = (r && r.v) ? r.v : [];
      $$('#qcard .blank').forEach(function (inp, i) {
        inp.value = vals[i] || '';
        if (revealed) { inp.classList.add(matchBlank(inp.value, q.blanks[i]) ? 'ok' : 'bad'); inp.disabled = true; }
      });
    }
    bindQuestion(q);
    if ($('#btnReveal')) $('#btnReveal').addEventListener('click', function () { reveal(q); });

    $('#btnPrev').style.visibility = S.idx === 0 ? 'hidden' : 'visible';
    var last = S.idx === S.paper.length - 1, btn = $('#btnNext');
    if (revealed) btn.textContent = last ? (S.mode === 'practice' ? '完成练习' : '交卷') : '下一题';
    else if (S.mode === 'practice') btn.textContent = '确认答案';
    else btn.textContent = last ? '交卷' : '下一题';
  }

  function blankInput(b, i, q, width) {
    return '<input class="blank" type="text" inputmode="' + (b.tol != null ? 'decimal' : 'text') + '" style="width:' + width + 'px" data-bi="' + i + '" autocomplete="off" aria-label="第' + (i + 1) + '空"' + (S.revealed[q.id] ? ' disabled' : '') + '>';
  }
  function fillStem(q) {
    var parts = String(q.stem).split(/_{2,}/);
    if (parts.length !== q.blanks.length + 1) return esc(q.stem) + '<div class="hint">（题干空位与答案数量不一致，请检查题库）</div>';
    if (q.match === 'set') {
      var head = parts[0].replace(/[：:、，,\s]+$/, '');
      var cells = q.blanks.map(function (b, i) {
        return '<span class="setblank"><b>' + (i + 1) + '</b>' + blankInput(b, i, q, 92) + '</span>';
      }).join('');
      return esc(head) + '<div class="setblanks">' + cells + '</div>';
    }
    var out = esc(parts[0]);
    for (var i = 0; i < q.blanks.length; i++) {
      var b = q.blanks[i];
      var w = Math.max(64, Math.min(140, 22 + String(b.a[0]).length * 16));
      out += blankInput(b, i, q, w) + esc(parts[i + 1]);
    }
    return out;
  }
  function feedback(q, r, score) {
    var ok = score >= 0.999;
    var answered = r && (q.type === 'fill'
      ? (r.v || []).some(function (x) { return String(x || '').trim(); })
      : (q.type === 'multi' ? (r.v || []).length > 0 : r.v != null));
    var head = !answered ? '答案已显示' : (ok ? '答对了' : '还有差距（得分 ' + Math.round(score * 100) + '%）');
    return '<div class="fb ' + (ok ? 'ok' : 'bad') + '"><b>' + head + '</b>'
      + '正确答案：' + esc(rightText(q)) + (q.explain ? '<div style="margin-top:6px">' + esc(q.explain) + '</div>' : '') + '</div>';
  }
  function bindQuestion(q) {
    $$('#qcard [data-opt]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (S.revealed[q.id]) return;
        var i = Number(b.getAttribute('data-opt'));
        if (q.type === 'multi') {
          var r = S.resp[q.id] || { v: [] };
          var k = r.v.indexOf(i); if (k >= 0) r.v.splice(k, 1); else r.v.push(i);
          S.resp[q.id] = r;
        } else S.resp[q.id] = { v: i };
        if (S.mode === 'practice') reveal(q); else renderQuestion();
      });
    });
    $$('#qcard [data-add]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (S.revealed[q.id]) return;
        var r = S.resp[q.id] || { v: [] }; r.v.push(b.getAttribute('data-add')); S.resp[q.id] = r;
        if (S.mode === 'practice' && r.v.length === q.items.length) reveal(q); else renderQuestion();
      });
    });
    $$('#qcard [data-pick]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (S.revealed[q.id]) return;
        var r = S.resp[q.id] || { v: [] };
        r.v = r.v.filter(function (x) { return x !== b.getAttribute('data-pick'); });
        S.resp[q.id] = r; renderQuestion();
      });
    });
    $$('#qcard .blank').forEach(function (inp) {
      inp.addEventListener('input', function () {
        var r = S.resp[q.id] || { v: [] };
        r.v[Number(inp.getAttribute('data-bi'))] = inp.value;
        S.resp[q.id] = r;
      });
    });
  }
  function reveal(q) {
    if (q.type === 'fill') {
      var r = S.resp[q.id] || { v: [] };
      $$('#qcard .blank').forEach(function (inp, i) { r.v[i] = inp.value; });
      S.resp[q.id] = r;
    }
    S.revealed[q.id] = true; renderQuestion();
  }
  function hasAnswer(q) {
    var r = S.resp[q.id]; if (!r) return false;
    if (q.type === 'fill') return (r.v || []).some(function (x) { return String(x || '').trim(); });
    if (q.type === 'multi') return (r.v || []).length > 0;
    if (q.type === 'order') return (r.v || []).length === q.items.length;
    return r.v != null;
  }
  function goNext() {
    var q = cur();
    if (!S.revealed[q.id]) {
      if (S.mode === 'practice') {
        if (!hasAnswer(q)) { toast('先作答，或点“看答案”'); return; }
        reveal(q); return;
      }
      if (S.idx < S.paper.length - 1) { S.idx++; renderQuestion(); window.scrollTo(0, 0); }
      else confirmSubmit();
      return;
    }
    if (S.idx < S.paper.length - 1) { S.idx++; renderQuestion(); window.scrollTo(0, 0); }
    else confirmSubmit();
  }


  /* ---------------- 成绩上传（仅在店内服务器模式下生效） ---------------- */
  var QUEUE_KEY = 'zg_queue_v1';

  function uploadResult(res) {
    if (!window.__SERVER__) return;
    var codeEl = document.getElementById('codeInput');
    var storeEl = document.getElementById('storeSel');
    var wrongList = [];
    S.paper.forEach(function (q) {
      var r = S.resp[q.id];
      var sc = grade(q, r);
      if (sc < 0.999) {
        wrongList.push({
          t: q.title || '',
          q: String(q.stem).slice(0, 70),
          my: myText(q, r).slice(0, 100),
          right: rightText(q).slice(0, 100)
        });
      }
    });
    var payload = {
      clientId: res.id,
      name: res.name,
      code: codeEl ? codeEl.value.trim() : '',
      store: (storeEl && storeEl.value) || window.__STORE__ || '',
      score: res.score, pass: res.pass, total: res.total, right: res.right,
      used: res.used, scope: res.scope, subs: res.subs, at: res.at,
      wrong: wrongList.slice(0, 100)
    };
    fetch('/api/result', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
      .then(function (r) { if (!r.ok) throw new Error('bad'); return r.json(); })
      .then(function () { setUploadTip('已上传到店里电脑'); })
      .catch(function () { queuePush(payload); setUploadTip('没连上服务器，成绩已存本机，下次打开会自动补传'); });
  }

  function setUploadTip(msg) {
    var el = document.getElementById('uploadTip');
    if (el) el.textContent = msg;
  }

  function queuePush(p) {
    try {
      var q = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
      q.push(p); localStorage.setItem(QUEUE_KEY, JSON.stringify(q));
    } catch (e) {}
  }

  function flushQueue() {
    if (!window.__SERVER__) return;
    var q = [];
    try { q = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch (e) { q = []; }
    if (!q.length) return;
    var p = q.shift();
    fetch('/api/result', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(p) })
      .then(function (r) { if (!r.ok) throw new Error('bad'); localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); flushQueue(); })
      .catch(function () {});
  }

  function initStore() {
    var sel = document.getElementById('storeSel');
    var wrap = document.getElementById('storeWrap');
    if (!sel || !wrap) return;
    if (window.__STORES__ && window.__STORES__.length > 1) {
      window.__STORES__.forEach(function (s) {

      detail.push({ id: q.id, domain: q.domain, sub: q.sub || '', type: q.type, title: q.title || '', stem: q.stem, sc: sc, ok: ok });
    });

  function download(text, filename, mime) {

  /* ---------------- 题库：CSV 导入 / 导出 ---------------- */
  function parseCSV(text) {
    text = String(text).replace(/^\uFEFF/, '');
    var rows = [], row = [], cur = '', q = false, i, c;
    for (i = 0; i < text.length; i++) {
      c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += c;
      } else {
        if (c === '"') q = true;
        else if (c === ',') { row.push(cur); cur = ''; }
        else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
        else if (c === '\r') { }
        else cur += c;
      }
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }

  var TYPE_MAP = { '填空': 'fill', '单选': 'single', '多选': 'multi', '判断': 'judge', '排序': 'order' };

  function parseAnsCell(cell) {
    cell = String(cell == null ? '' : cell).trim();
    if (!cell) return null;
    var tol = null, m = cell.match(/^(.*?)±([\d.]+)$/);
    if (m) { cell = m[1]; tol = parseFloat(m[2]); }
    var arr = cell.split('/').map(function (s) { return s.trim(); }).filter(Boolean);
    if (!arr.length) return null;
    var b = { a: arr };
    if (tol != null) b.tol = tol;
    return b;
  }

  function bankFromCSV(text) {
    var rows = parseCSV(text);
    var hi = -1, i, j;
    for (i = 0; i < Math.min(rows.length, 6); i++) {
      if (rows[i].some(function (c) { return String(c).trim() === '编号'; })) { hi = i; break; }
    }
    if (hi < 0) return { err: '没找到表头（需要包含“编号”列）' };
    var head = rows[hi].map(function (s) { return String(s).trim(); });
    var idx = {};
    head.forEach(function (h, k) { if (h) idx[h] = k; });
    var need = ['编号', '大类', '题型', '题干'];
    for (i = 0; i < need.length; i++) if (idx[need[i]] == null) return { err: '缺少列：' + need[i] };

    var dmap = {}, smap = {};
    BANK.domains.forEach(function (d) {
      dmap[d.name] = d.id;
      (d.subs || []).forEach(function (s) { smap[s.name] = s.id; });
    });

    var qs = [], ids = {}, skipped = 0;
    for (i = hi + 1; i < rows.length; i++) {
      var row = rows[i];
      if (!row || row.every(function (c) { return !String(c).trim(); })) continue;
      var id = String(row[idx['编号']] || '').trim();
      if (!id) { skipped++; continue; }
      if (ids[id]) return { err: '编号重复：' + id };
      ids[id] = 1;

      var domNameCn = String(row[idx['大类']] || '').trim();
      var domain = dmap[domNameCn];
      if (!domain) return { err: id + ' 的大类不认识：' + domNameCn };
      var subCn = idx['小类'] != null ? String(row[idx['小类']] || '').trim() : '';
      var sub = subCn ? smap[subCn] : '';
      if (subCn && !sub) return { err: id + ' 的小类不认识：' + subCn };
      var typeCn = String(row[idx['题型']] || '').trim();
      var type = TYPE_MAP[typeCn];
      if (!type) return { err: id + ' 的题型不认识：' + typeCn };

      var stem = String(row[idx['题干']] || '').trim();
      var q = { id: id, domain: domain, type: type, stem: stem };
      if (idx['产品'] != null) {
        var pn = String(row[idx['产品']] || '').trim();
        if (pn) q.product = pn;
      }
      if (idx['标题'] != null) q.title = String(row[idx['标题']] || '').trim();
      if (idx['解析'] != null) q.explain = String(row[idx['解析']] || '').trim();
      if (idx['标签'] != null) {
        var tg = String(row[idx['标签']] || '').trim();
        if (tg) q.tags = tg.split(/[,，]/).map(function (s) { return s.trim(); }).filter(Boolean);
      }
      if (sub) q.sub = sub;

      var opts = [];
      for (j = 0; j < 6; j++) {
        var col = '选项' + String.fromCharCode(65 + j);
        if (idx[col] != null) {
          var v = String(row[idx[col]] || '').trim();
          if (v) opts.push(v);
        }
      }
      if (idx['匹配方式'] != null && String(row[idx['匹配方式']] || '').trim() === '集合') q.match = 'set';

      if (type === 'fill') {
        var blanks = [];
        for (j = 1; j <= 10; j++) {
          if (idx['答案' + j] == null) continue;
          var b = parseAnsCell(row[idx['答案' + j]]);
          if (b) blanks.push(b);
        }
        if (!blanks.length) return { err: id + ' 没有答案' };
        var holes = (stem.match(/_{2,}/g) || []).length;
        if (holes !== blanks.length) return { err: id + ' 题干空位 ' + holes + ' 个，答案 ' + blanks.length + ' 个，对不上' };
        q.blanks = blanks;
      } else if (type === 'single' || type === 'multi') {
        if (opts.length < 2) return { err: id + ' 选项不足' };
        q.options = opts;
        var ans = String(row[idx['正确答案']] || '').trim().toUpperCase().replace(/[^A-F]/g, '');
        if (!ans) return { err: id + ' 缺少正确答案' };
        if (type === 'single') q.answer = ans.charCodeAt(0) - 65;
        else q.answers = ans.split('').map(function (c) { return c.charCodeAt(0) - 65; });
      } else if (type === 'judge') {
        var jv = String(row[idx['正确答案']] || '').trim();
        q.answer = /对|正确|是|true|√/i.test(jv);
      } else if (type === 'order') {
        if (opts.length < 2) return { err: id + ' 排序项不足' };
        q.items = opts.map(function (t, k) { return { id: String.fromCharCode(97 + k), text: t }; });
        var seq = String(row[idx['正确答案']] || '').trim().toUpperCase().replace(/[^A-F]/g, '');
        q.answer = seq.split('').map(function (c) { return String.fromCharCode(97 + c.charCodeAt(0) - 65); });
      }
      qs.push(q);
    }
    if (!qs.length) return { err: '没有读到题目' + (skipped ? '（' + skipped + ' 行缺编号）' : '') };

    return { questions: qs };
  }

  function applyBank(qs) {
    BANK = {
      meta: { title: '自定义题库', version: 'custom', demo: false, note: '已导入 ' + qs.length + ' 题' },
      domains: BANK.domains,
      questions: qs
    };
    store.set(K.bank, BANK);
    S.scope = BANK.domains.filter(function (d) { return qs.some(function (q) { return q.domain === d.id; }); }).map(function (d) { return d.id; });
    S.subs = [];
    renderHome();
  }

  function importBank(file) {
    if (/\.xlsx?$/i.test(file.name)) { toast('Excel 不能直接读：请先在 Excel 里“另存为 → CSV UTF-8”，再导入那个 CSV'); return; }
    var fr = new FileReader();
    fr.onload = function () {
      var text = String(fr.result || '');
      if (/\.json$/i.test(file.name)) {
        var b;
        try { b = JSON.parse(text); } catch (e) { toast('JSON 解析失败'); return; }
        if (!b.questions || !b.questions.length) { toast('文件里没有题目'); return; }
        if (b.domains) BANK.domains = b.domains;
        applyBank(b.questions);
        toast('已导入 ' + b.questions.length + ' 题');
        return;
      }
      var r = bankFromCSV(text);
      if (r.err) { toast('导入失败：' + r.err); return; }
      applyBank(r.questions);
      var st = bankStats();
      toast('已导入 ' + st.total + ' 题，配方填空 ' + Math.round(st.ratio * 100) + '%');
    };
    fr.readAsText(file, 'utf-8');
  }

  function exportBank() {
    var head = ['编号', '大类', '小类', '产品', '题型', '标题', '题干',
      '选项A', '选项B', '选项C', '选项D', '选项E', '选项F',
      '答案1', '答案2', '答案3', '答案4', '答案5', '答案6', '答案7', '答案8', '答案9', '答案10', '正确答案', '匹配方式', '解析', '标签'];
    var tl = { fill: '填空', single: '单选', multi: '多选', judge: '判断', order: '排序' };
    var lines = [head];
    BANK.questions.forEach(function (q) {
      var row = [q.id, domName(q.domain), q.sub ? subName(q.sub) : '', q.product || q.title || q.id, tl[q.type], q.title || '', q.stem];
      var opts = q.options || (q.items ? q.items.map(function (i) { return i.text; }) : []);
      for (var i = 0; i < 6; i++) row.push(opts[i] || '');
      for (i = 0; i < 10; i++) {
        if (q.blanks && q.blanks[i]) row.push(q.blanks[i].a.join('/') + (q.blanks[i].tol != null ? '±' + q.blanks[i].tol : ''));
        else row.push('');
      }
      if (q.type === 'single') row.push(String.fromCharCode(65 + q.answer));
      else if (q.type === 'multi') row.push(q.answers.map(function (i) { return String.fromCharCode(65 + i); }).join(''));
      else if (q.type === 'judge') row.push(q.answer ? '对' : '错');
      else if (q.type === 'order') row.push(q.answer.map(function (id) { return String.fromCharCode(65 + id.charCodeAt(0) - 97); }).join(','));
      else row.push('');
      row.push(q.match === 'set' ? '集合' : '顺序');
      row.push(q.explain || '');
      row.push((q.tags || []).join(','));
      lines.push(row);
    });
    var csv = lines.map(function (r) {
      return r.map(function (c) { return '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"'; }).join(',');
    }).join('\r\n');
    download('\ufeff' + csv, '题库导出-' + fmtTime(Date.now()).slice(0, 10).replace(/-/g, '') + '.csv', 'text/csv;charset=utf-8');
    toast('已导出 CSV');
  }

  /* ---------------- 事件 ---------------- */
  function backHome() { show('home'); renderHome(); }

  function bindHome() {
    $('#modeSeg').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-mode]'); if (!b) return;
      S.mode = b.getAttribute('data-mode'); renderHome();
    });

    $('#chips').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-dom]'); if (!b || b.disabled) return;
      var id = b.getAttribute('data-dom');
      var on = S.scope.indexOf(id) >= 0;
      if (id === 'recipe' && on) { openSheet(); return; }
      if (on) S.scope.splice(S.scope.indexOf(id), 1);
      else S.scope.push(id);
      if (!S.scope.length) S.scope = BANK.domains.map(function (d) { return d.id; });
      if (S.scope.indexOf('recipe') < 0) S.subs = [];
      renderHome();
      if (id === 'recipe' && !on) setTimeout(openSheet, 120);
    });
    $('#sheetChips').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-sub]'); if (!b || b.disabled) return;
      var id = b.getAttribute('data-sub'), i = S.subs.indexOf(id);
      if (i >= 0) S.subs.splice(i, 1); else S.subs.push(id);
      b.classList.toggle('on');
    });
    $('#sheetAll').addEventListener('click', function () { S.subs = []; closeSheet(); renderHome(); });
    $('#sheetOff').addEventListener('click', function () {
      S.scope = S.scope.filter(function (x) { return x !== 'recipe'; });
      S.subs = []; closeSheet(); renderHome();
      toast('已取消后厨配方');
    });
    $('#sheetDone').addEventListener('click', function () { closeSheet(); renderHome(); });
    $$('[data-sheet-close]').forEach(function (el) { el.addEventListener('click', closeSheet); });

    $('#btnStart').addEventListener('click', startRun);
    $('#nameInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') startRun(); });
    $('#lnkRecords').addEventListener('click', function () { renderRecords(); show('records'); });
    $('#lnkStats').addEventListener('click', function () { renderStats(); show('stats'); });
    $('#lnkWrong').addEventListener('click', function () {
      if (!WRONG.length) { toast('错题本还是空的，先考一次'); return; }
      S.wrongOnly = true; S.mode = 'practice'; startRun();
    });
    $('#lnkClearWrong').addEventListener('click', function () {
      if (!confirm('清空错题本？只影响错题记录，不影响成绩。')) return;
      WRONG = []; store.set(K.wrong, []); renderHome(); toast('错题本已清空');
    });
    var impBtn = $('#lnkImport'); if (impBtn) impBtn.addEventListener('click', function () { $('#fileInput').click(); });
    var expBtn = $('#lnkExport'); if (expBtn) expBtn.addEventListener('click', exportBank);
    var fileEl = $('#fileInput'); if (fileEl) fileEl.addEventListener('change', function (e) {
      var f = e.target.files && e.target.files[0]; if (f) importBank(f); e.target.value = '';
    });
    document.addEventListener('click', function (e) {
      if (e.target.closest('[data-back]')) backHome();
    });
  }

  function bindQuiz() {
    $('#btnNext').addEventListener('click', goNext);
    $('#btnSubmit').addEventListener('click', confirmSubmit);
    $('#btnPrev').addEventListener('click', function () { if (S.idx > 0) { S.idx--; renderQuestion(); window.scrollTo(0, 0); } });
    $('#btnQuit').addEventListener('click', function () {
      if (!confirm('退出本次' + (S.mode === 'practice' ? '练习' : '考试') + '？已答内容不会保存。')) return;
      stopTimer(); backHome();
    });
  }

  function init() {
    var has = BANK.domains.filter(function (d) {
      return BANK.questions.some(function (q) { return q.domain === d.id; });
    }).map(function (d) { return d.id; });
    S.scope = has.length ? has : BANK.domains.map(function (d) { return d.id; });
    bindHome(); bindQuiz(); renderHome(); initStore(); flushQueue();

    // 静态托管版：去掉导入/导出入口，加“清除本机数据”
    if (window.__STATIC__) {
      ['lnkImport', 'lnkExport'].forEach(function (id) {
        var e = document.getElementById(id);
        if (e && e.parentNode) e.parentNode.removeChild(e);
      });
      var fi = document.getElementById('fileInput');
      if (fi && fi.parentNode) fi.parentNode.removeChild(fi);
      var foot = document.getElementById('footNote');
      if (foot) foot.textContent = '成绩只存在这台设备 · 可随时清除 · 换设备不同步';
      var links = document.querySelector('.links');
      if (links) {
        var wipe = document.createElement('button');
        wipe.id = 'lnkWipe';
        wipe.textContent = '清除本机数据';
        links.appendChild(wipe);
        wipe.addEventListener('click', function () {
          if (!confirm('清除这台设备上的成绩、错题和缓存？此操作不可撤销。')) return;
          try {
            ['zg_results_v3', 'zg_wrong_v3', 'zg_queue_v1', 'zg_bank_v3'].forEach(function (k) { localStorage.removeItem(k); });
          } catch (e) {}
          RESULTS = []; WRONG = [];
          renderHome();
          toast('本机数据已清除');
        });
      }
    }
    if (!store.ok()) setTimeout(function () { toast('本机限制了本地存储，请及时导出'); }, 800);
    var h = location.hash.replace('#', '');
    if (h === 'practice' || h === 'exam') { S.mode = h; renderHome(); setTimeout(startRun, 50); }
  }

  init();
})();
</script>
</body>
</html>
